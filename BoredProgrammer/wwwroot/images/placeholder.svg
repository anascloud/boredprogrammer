<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="anascloud cover placeholder">
  <defs>
    <radialGradient id="sky" cx="50%" cy="-10%" r="130%">
      <stop offset="0" stop-color="#0d1930"/>
      <stop offset="0.45" stop-color="#070c18"/>
      <stop offset="1" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16264a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3b5488" stop-opacity=".3"/>
      <stop offset="1" stop-color="#16264a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c7dbff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7fa3e6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="#eef4ff">
        <circle cx="10" cy="18" r="0.7" opacity=".6"/>
        <circle cx="38" cy="8" r="1" opacity=".8"/>
        <circle cx="64" cy="26" r="0.6" opacity=".5"/>
        <circle cx="92" cy="14" r="0.8" opacity=".65"/>
        <circle cx="108" cy="40" r="0.6" opacity=".5"/>
        <circle cx="22" cy="52" r="0.8" opacity=".6"/>
        <circle cx="50" cy="64" r="0.6" opacity=".45"/>
        <circle cx="78" cy="50" r="1" opacity=".75"/>
        <circle cx="104" cy="72" r="0.7" opacity=".55"/>
        <circle cx="14" cy="88" r="0.7" opacity=".55"/>
        <circle cx="44" cy="100" r="0.9" opacity=".7"/>
        <circle cx="72" cy="86" r="0.6" opacity=".5"/>
        <circle cx="98" cy="108" r="0.8" opacity=".6"/>
        <circle cx="116" cy="94" r="0.5" opacity=".45"/>
        <circle cx="30" cy="116" r="0.6" opacity=".5"/>
        <circle cx="86" cy="118" r="0.7" opacity=".55"/>
      </g>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#sky)"/>
  <ellipse cx="860" cy="180" rx="620" ry="150" transform="rotate(-22 860 180)" fill="url(#band)" filter="url(#soft)" opacity=".9"/>
  <rect width="1200" height="750" fill="url(#stars)"/>

  <circle cx="850" cy="180" r="26" fill="url(#glow)"/>
  <circle cx="850" cy="180" r="1.8" fill="#ffffff"/>
  <circle cx="260" cy="520" r="20" fill="url(#glow)" opacity=".7"/>
  <circle cx="260" cy="520" r="1.5" fill="#ffffff"/>

  <g text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
    <text x="600" y="392" font-size="34" font-weight="600" fill="#e8eef8" letter-spacing="6">anascloud</text>
    <text x="600" y="432" font-size="13" fill="#8fa0b8" letter-spacing="5">.NET · AI · CLOUD</text>
  </g>
</svg>
