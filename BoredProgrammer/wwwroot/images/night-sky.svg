<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dark night sky with stars">
  <defs>
    <radialGradient id="sky" cx="50%" cy="-12%" r="135%">
      <stop offset="0" stop-color="#0d1930"/>
